# Default pipeline hyperparameters and data-fetch settings.
# Override with --config path/to/other.yaml or by editing this file directly.

n_lags: 24        # hours of history used as model input
k: 6              # number of VMD modes (IMFs)
test_frac: 0.2    # fraction of series held out for testing (chronological split)

vmd:
  alpha: 2000.0   # bandwidth-constraint (reconstruction fidelity)
  tau: 0.0        # noise tolerance
  DC: false       # constrain first mode to 0-frequency
  init: 1         # 1 = uniform init of center frequencies
  tol: 1.0e-7     # convergence tolerance

bp:
  hidden_layer_sizes: [64, 32]
  max_epochs: 200
  patience: 15
  lr: 0.001

lstm:
  hidden_size: 32
  num_layers: 1
  epochs: 100     # maximum; early stopping on the validation block
  patience: 10
  lr: 0.001
  batch_size: 64

gbm:
  max_iter: 400
  learning_rate: 0.05
  max_leaf_nodes: 31

baselines:
  seasonal_naive: true
  sarima: true
  sarima_order: [2, 0, 1]
  sarima_seasonal_order: [1, 0, 1, 24]
  sarima_max_fit_hours: 2000
  gbm: true
  lstm_tuned: true
  tuning_grid:
    hidden_size: [32, 64, 128]
    num_layers: [1, 2]
    lr: [0.001, 0.003]

# Used by scripts/fetch_data.py
openaq:
  city: chennai
  lat: 13.0827
  lon: 80.2707
  radius_m: 25000            # OpenAQ's max allowed radius per request (25 km)
  datetime_from: "2025-10-01"  # inclusive, local (IST) date
  datetime_to: "2026-09-30"    # inclusive, local (IST) date -> 12 months (includes NE monsoon / winter)
  timezone: Asia/Kolkata
  merge_method: mean         # "mean" or "median" across stations
  min_station_coverage: 0.5  # drop stations with < 50% of the window's hours
  min_coverage_pct: 0.0      # drop hours with API-reported coverage below this (0 = off)
  max_value: 1000.0          # ug/m3; larger values treated as sensor faults
  min_stations: 1            # min stations per merged hour
